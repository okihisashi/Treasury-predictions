name: Update HYPE & SOL β from Polymarket

on:
  schedule:
    # Daily at 00:15 UTC (= 09:15 JST)
    - cron: '15 0 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update HYPE β
        run: node scripts/update-hype-beta.js

      - name: Update SOL β
        run: node scripts/update-sol-beta.js

      - name: Commit & push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add predictions/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update HYPE & SOL β $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
