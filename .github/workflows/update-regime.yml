name: Update market regime (冬/夏)

on:
  schedule:
    - cron: '20 * * * *'   # 毎時 :20 (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update regime.json
        run: node scripts/update-regime.js

      - name: Commit & push
        run: |
          git config user.name "regime-bot"
          git config user.email "bot@users.noreply.github.com"
          git add predictions/regime.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update regime $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin main
            git push
          fi
